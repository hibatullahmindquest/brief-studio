name: Feature request
description: Suggest a new idea for PostForge AI
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Share your idea clearly so contributors can implement it quickly.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem does this solve?
      placeholder: It is hard to reuse generated content across channels.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you want to happen.
      placeholder: Add one-click channel adapters for Instagram, TikTok, and LinkedIn.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Could also be solved with ...

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Extra context
      placeholder: Mockups, examples, links, etc.
